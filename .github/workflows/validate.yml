name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --include=dev --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
