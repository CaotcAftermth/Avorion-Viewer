name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --include=dev --ignore-scripts
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      # Keep reruns distinct; previous attempts retain their uploaded artifacts.
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      # Upload completion can precede visibility in the Actions artifact API.
      - name: Wait for Pages artifact metadata
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            for (let attempt = 0; attempt < 12; attempt++) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo, run_id: context.runId
              });
              const matches = artifacts.filter(artifact => artifact.name === process.env.PAGES_ARTIFACT_NAME && !artifact.expired);
              if (matches.length === 1) return;
              if (matches.length > 1) throw new Error('Multiple Pages artifacts found for this attempt.');
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Pages artifact metadata did not become available.');
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
