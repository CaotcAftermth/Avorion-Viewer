name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --include=dev --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/site/requirements.txt
      - run: python -m pip install -r docs/site/requirements.txt
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      # Keep reruns distinct; previous attempts retain their uploaded artifacts.
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      # Match the artifact client bundled by deploy-pages@v4. Keep this CI-only
      # dependency outside the app's package.json and node_modules.
      - name: Install Pages artifact client
        run: npm install --prefix "$RUNNER_TEMP/pages-artifact-client" --no-save --package-lock=false --ignore-scripts @actions/artifact@2.1.3
      # REST visibility does not guarantee visibility in the Results service
      # used by deploy-pages. Poll the same client and backend as deployment.
      - name: Wait for Pages artifact metadata
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            const { DefaultArtifactClient } = require(`${process.env.RUNNER_TEMP}/pages-artifact-client/node_modules/@actions/artifact`);
            const client = new DefaultArtifactClient();
            for (let attempt = 0; attempt < 12; attempt++) {
              const { artifacts } = await client.listArtifacts();
              const matches = artifacts.filter(artifact => artifact.name === process.env.PAGES_ARTIFACT_NAME);
              if (matches.length === 1) {
                core.info(`Pages artifact ${matches[0].id} is visible to the deployment artifact service.`);
                return;
              }
              if (matches.length > 1) throw new Error('Multiple Pages artifacts found for this attempt.');
              if (attempt < 11) {
                core.info(`Waiting for Pages artifact visibility (${attempt + 1}/12)...`);
                await new Promise(resolve => setTimeout(resolve, 5000));
              }
            }
            throw new Error('Pages artifact did not become visible in the deployment artifact service after 12 checks.');
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
