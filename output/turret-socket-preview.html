<div id="turret-preview" class="viz-dotted-background">
<style>
#turret-preview{padding:16px;font:14px system-ui;color:light-dark(#202b38,#e0e7ef)}
#turret-preview .window{background:light-dark(#f4f6f8,#202630);border:1px solid light-dark(#c3ccd6,#414b59);border-radius:9px;overflow:hidden}
#turret-preview header{padding:14px 18px;background:light-dark(#e4e9ef,#2b3440);font-weight:500}
#turret-preview .layout{display:flex;flex-wrap:wrap}
#turret-preview .scene{flex:1 1 340px;min-width:0;background:light-dark(#e9eef3,#171e27);position:relative}
#turret-preview svg{width:100%;height:310px;display:block}
#turret-preview aside{flex:1 1 200px;padding:18px;max-width:260px}
#turret-preview label{display:block;margin:0 0 16px}
#turret-preview select{display:block;margin-top:8px;padding:8px;width:100%;color:inherit;background:light-dark(#fff,#303b49);border:1px solid light-dark(#b4bfcc,#526071);border-radius:4px}
#turret-preview .details{border-top:1px solid light-dark(#c3ccd6,#414b59);margin-top:22px;padding-top:14px;line-height:1.8}
#turret-preview footer{padding:12px 18px;border-top:1px solid light-dark(#c3ccd6,#414b59)}
#turret-preview .hull{fill:light-dark(#b6c3d1,#455568);stroke:light-dark(#8295a9,#677b91);stroke-width:1.5}
#turret-preview .block{fill:light-dark(#d0dce7,#667c93);stroke:light-dark(#627c96,#9cb5ce);stroke-width:2}
#turret-preview .socket{fill:light-dark(#e5f7ff,#203e50);stroke:light-dark(#007ca8,#58caff);stroke-width:3}
#turret-preview .normal{stroke:light-dark(#007ca8,#58caff);stroke-width:3;fill:none}
#turret-preview .caption{fill:light-dark(#253d53,#d2e3f2);font:14px system-ui}
#turret-preview button{color:inherit;background:light-dark(#e5ebf1,#334152);border:1px solid light-dark(#a3b2c2,#63758b);border-radius:5px;padding:9px 12px;margin:4px 4px 4px 0}
#turret-preview button[aria-pressed=true]{background:light-dark(#244c69,#c7deef);color:light-dark(#fff,#172633)}
</style>
<div class="window"><header>Turret Editor · Socket preview</header><div class="layout">
<div class="scene"><svg viewBox="0 0 450 310" role="img" aria-label="Schematic ship hull with two turret blocks and selectable face socket markers">
<path class="hull" d="M40 192 221 114 415 188 240 271Z"/><path class="hull" d="M40 192 240 271 240 292 40 214Z"/><path class="hull" d="M240 271 415 188 415 208 240 292Z"/>
<path class="block" d="M115 170 174 145 234 168 175 196Z M115 170V204L175 230V196 M175 230 234 201V168"/>
<path class="block" d="M269 182 312 164 355 180 312 200Z M269 182V206L312 225V200 M312 225 355 204V180"/>
<g data-mark="top"><ellipse class="socket" cx="175" cy="170" rx="17" ry="8"/><path class="normal" d="M175 170V105 M169 114 175 105 181 114"/><text class="caption" x="188" y="112">Top</text></g>
<g data-mark="side" hidden><ellipse class="socket" cx="205" cy="199" rx="8" ry="13"/><path class="normal" d="M205 199 261 174 M250 173 261 174 255 184"/><text class="caption" x="263" y="166">Side</text></g>
<g data-mark="other" hidden><ellipse class="socket" cx="312" cy="182" rx="12" ry="6"/><path class="normal" d="M312 182V140 M306 149 312 140 318 149"/></g>
<text class="caption" x="30" y="35">Main viewport</text><text class="caption" x="30" y="57">Schematic geometry</text>
</svg></div>
<aside><label><input type="checkbox" data-show checked> Show turret sockets</label><label>Visible sockets<select data-scope><option value="selected">Selected turret block</option><option value="all">All turret blocks</option></select></label><div>Inspect face</div><button data-face="top" aria-pressed="true">Top</button><button data-face="side" aria-pressed="false">Side</button><div class="details" aria-live="polite">Type: <strong>Turret</strong><br>Block: <strong>Turret block 42</strong><br>Face: <strong data-selected>Top</strong><br>Status: Candidate · Unoccupied</div></aside>
</div><footer>Ring: attachment point · Stem: outward direction</footer></div>
<script>
(()=>{const root=document.getElementById('turret-preview');let face='top';const show=root.querySelector('[data-show]'),scope=root.querySelector('[data-scope]');function draw(){root.querySelectorAll('[data-mark]').forEach(e=>{e.style.display=show.checked&&(e.dataset.mark===face||(e.dataset.mark==='other'&&scope.value==='all'))?'':'none';e.removeAttribute('hidden')});root.querySelectorAll('[data-face]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.face===face)));root.querySelector('[data-selected]').textContent=face==='top'?'Top':'Side'}function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{face,scope:scope.value,showSockets:show.checked}}).catch(()=>{})}function restore(s){if(!s)return;face=s.face==='side'?'side':'top';scope.value=s.scope==='all'?'all':'selected';show.checked=s.showSockets!==false;draw()}root.querySelectorAll('[data-face]').forEach(b=>b.onclick=()=>{face=b.dataset.face;draw();save()});show.onchange=scope.onchange=()=>{draw();save()};restore(window.openai?.widgetState?.modelContent);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState?.modelContent));draw()})();
</script></div>
